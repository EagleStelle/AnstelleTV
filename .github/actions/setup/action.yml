name: Set up build
description: JDK 17, Node, pnpm and Gradle for the app and its web UI.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # Reads the pinned version from packageManager in webui/package.json.
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: webui/package.json
        cache: true
        cache_dependency_path: webui/pnpm-lock.yaml

    # The default "enhanced" cache is a commercial service, only in free preview for private repos.
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
