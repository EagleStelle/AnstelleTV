name: CI

on:
  push:
    branches: ['**']
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Type-check web UI
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Build, lint and unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest :core:model:test :core:common:test :core:scheduler:test :core:livetv:test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
